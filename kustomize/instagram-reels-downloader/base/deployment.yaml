---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instagram-reels-downloader
  labels:
    app: instagram-reels-downloader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: instagram-reels-downloader
  template:
    metadata:
      labels:
        app: instagram-reels-downloader
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
      - name: instagram-reels-downloader
        image: IMAGE_TEMPLATE
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "60m"
          limits:
            memory: "128Mi"
            cpu: "120m"
        env:
          - name: YTDLP_COOKIES
            value: /run/secrets/instagram/cookies.txt
        volumeMounts:
          - name: instagram-cookies
            mountPath: /run/secrets/instagram
            readOnly: true
      volumes:
        - name: instagram-cookies
          secret:
            secretName: instagram-cookies
            defaultMode: 0400
