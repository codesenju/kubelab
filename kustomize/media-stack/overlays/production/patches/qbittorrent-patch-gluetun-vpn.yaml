apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  template:
    spec:
      # Route all pod DNS through gluetun's local resolver (127.0.0.1). Without
      # this, containers inherit the cluster resolver (e.g. 1.1.1.1) which
      # gluetun's kill-switch firewall blocks, breaking tracker/DHT resolution.
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - "127.0.0.1"
      # qBittorrent and gluetun share this pod's network namespace, so all of
      # qBittorrent's traffic egresses through the gluetun WireGuard tunnel.
      initContainers:
      # WireGuard needs src_valid_mark=1 because Cilium sets rp_filter=strict.
      - name: sysctl
        image: busybox:1.36
        command:
          - /bin/sh
          - -c
          - sysctl -w net.ipv4.conf.all.src_valid_mark=1
        securityContext:
          privileged: true
      containers:
      # ---------------------------------------------------------------------
      # gluetun VPN sidecar (Mullvad, WireGuard) — owns the pod network egress
      # ---------------------------------------------------------------------
      - name: gluetun
        image: ghcr.io/qdm12/gluetun:v3.41.3
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "custom"
        - name: VPN_TYPE
          value: "wireguard"
        - name: WIREGUARD_IMPLEMENTATION
          value: "kernelspace"   # node has the wireguard kernel module; faster + reliable here
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: qbittorrent-vpn
              key: WIREGUARD_PRIVATE_KEY
        - name: WIREGUARD_PUBLIC_KEY
          value: "2RSnfqTRb0BL/bPaKGj0OA/qopQaNG1qtzEH2Y8JyjE="   # Mullvad peer (ie-dub-wg-102)
        - name: WIREGUARD_ENDPOINT_IP
          value: "146.70.189.130"    # force exact IPv4 endpoint (avoids gluetun picking an IPv6 server)
        - name: WIREGUARD_ENDPOINT_PORT
          value: "51820"
        - name: WIREGUARD_ADDRESSES
          value: "10.65.228.136/32"  # from ie-dub-wg-102.conf [Interface] Address (IPv4)
        # Allow the cluster (pods + services) to reach the qBittorrent WebUI
        # through gluetun's firewall/kill-switch. Cilium cluster-pool = 10.0.0.0/8.
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "10.0.0.0/8,10.96.0.0/12"
        # Open the WebUI port inbound through gluetun's firewall (INPUT policy is
        # DROP by default), so Traefik/cluster can reach qBittorrent on 8080.
        - name: FIREWALL_INPUT_PORTS
          value: "8080"
        # Cluster is IPv4-only (Cilium cluster-pool). Use gluetun's internal DNS
        # (DoT) resolver; trackers resolve fine once the tunnel is up.
        - name: DNS_KEEP_NAMESERVER
          value: "off"
        volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "wget -qO- -T 8 https://am.i.mullvad.net/connected | grep -q 'You are connected'"]
          initialDelaySeconds: 40
          periodSeconds: 60
          timeoutSeconds: 12
          failureThreshold: 3
      # ---------------------------------------------------------------------
      # qBittorrent — no VPN logic of its own; routes via gluetun
      # ---------------------------------------------------------------------
      - name: qbittorrent
        env:
        - name: VPN_ENABLED
          value: "false"
      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
