apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  template:
    spec:
      initContainers:
      # WireGuard requires src_valid_mark=1 when rp_filter is strict (Cilium default).
      # Set it in the pod network namespace before the app container starts.
      - name: sysctl
        image: ghcr.io/hotio/qbittorrent
        command:
          - /bin/sh
          - -c
          - sysctl -w net.ipv4.conf.all.src_valid_mark=1
        securityContext:
          privileged: true
      containers:
      - name: qbittorrent
        securityContext:
          allowPrivilegeEscalation: true   # wg-quick needs to raise caps
          capabilities:
            add:
              - NET_ADMIN   # Required for the built-in WireGuard VPN
        env:
        - name: VPN_ENABLED
          value: "true"
        - name: VPN_CONF
          value: "wg0"            # Reads /config/wireguard/wg0.conf
        - name: VPN_PROVIDER
          value: "generic"
        - name: VPN_LAN_NETWORK
          value: "10.0.0.0/8,10.96.0.0/12" # Cilium cluster-pool pod CIDR + service CIDR so Traefik can reach the WebUI through the VPN kill-switch
        - name: VPN_LAN_LEAK_ENABLED
          value: "false"
        - name: VPN_AUTO_PORT_FORWARD
          value: "false"
        - name: VPN_HEALTHCHECK_ENABLED
          value: "false"
        - name: PRIVOXY_ENABLED
          value: "false"
        - name: UNBOUND_ENABLED
          value: "false"
        volumeMounts:
        - name: vpn-wireguard
          mountPath: /config/wireguard/wg0.conf
          subPath: wg0.conf
          readOnly: true
      volumes:
      - name: vpn-wireguard
        secret:
          secretName: qbittorrent-vpn
          items:
          - key: wg0.conf
            path: wg0.conf
