apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/component: download-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/component: download-client
    spec:
      containers:
      - name: qbittorrent
        image: ghcr.io/hotio/qbittorrent
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1001"
        - name: UMASK
          value: "002"
        - name: TZ
          value: Etc/GMT-2
        - name: WEBUI_PORTS
          value: 8080/tcp
        - name: LIBTORRENT
          value: v1
        ports:
        - containerPort: 8080
          name: webui
        volumeMounts:
        - name: media-stack-config
          mountPath: /config
          subPath: qbittorrent/config
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: media-stack-config
        persistentVolumeClaim:
          claimName: media-stack-config
      - name: data
        persistentVolumeClaim:
          claimName: media-data
