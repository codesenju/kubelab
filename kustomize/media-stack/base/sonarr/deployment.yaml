apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app.kubernetes.io/component: tv-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
        app.kubernetes.io/component: tv-management
    spec:
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:latest
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: shared-permissions
        - configMapRef:
            name: global-env
        ports:
        - containerPort: 8989
          name: http
        volumeMounts:
        # Config moved off shared NFS (media-stack-config) to a dedicated
        # TrueNAS iSCSI block volume to fix SQLite-on-NFS locking/corruption.
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        startupProbe:
          httpGet:
            path: /
            port: 8989
          # Generous budget: first boot after the iSCSI migration runs SQLite
          # DB migration on a 67M+ DB, which exceeds a tight probe window.
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /
            port: 8989
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /
            port: 8989
          initialDelaySeconds: 0
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-config
      - name: data
        persistentVolumeClaim:
          claimName: media-data
