# Recovered Sonarr/Radarr config volumes. Originals remain on their original
# PVCs; these retained copies are the active, integrity-checked databases.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config-recovered-20261112
  labels:
    app: sonarr
    app.kubernetes.io/component: tv-management
    app.kubernetes.io/instance: media-stack-prod
    app.kubernetes.io/managed-by: kustomize-v5.8.1
    app.kubernetes.io/part-of: media-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-media
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: sonarr-config-before-repair-20261112
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: sonarr-config-before-repair-20261112
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config-recovered-20261112
  labels:
    app: radarr
    app.kubernetes.io/component: movie-management
    app.kubernetes.io/instance: media-stack-prod
    app.kubernetes.io/managed-by: kustomize-v5.8.1
    app.kubernetes.io/part-of: media-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-media
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: radarr-config-before-repair-20261112
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: radarr-config-before-repair-20261112
  resources:
    requests:
      storage: 5Gi
