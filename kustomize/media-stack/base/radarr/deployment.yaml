apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app.kubernetes.io/component: movie-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
        app.kubernetes.io/component: movie-management
    spec:
      containers:
      - name: radarr
        image: lscr.io/linuxserver/radarr:latest
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: shared-permissions
        - configMapRef:
            name: global-env
        ports:
        - containerPort: 7878
          name: http
        volumeMounts:
        # Config moved off shared NFS (media-stack-config) to a dedicated
        # TrueNAS iSCSI block volume to fix SQLite-on-NFS locking/corruption.
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "64m"
            memory: "128Mi"
          limits:
            cpu: "256m"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /
            port: 7878
          # Generous budget so first boot after the iSCSI migration can finish
          # SQLite DB migration before the probe starts failing the container.
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /
            port: 7878
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /
            port: 7878
          initialDelaySeconds: 0
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: radarr-config
      - name: data
        persistentVolumeClaim:
          claimName: media-data
