---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: downcut
  labels:
    app: downcut
spec:
  replicas: 1
  selector:
    matchLabels:
      app: downcut
  template:
    metadata:
      labels:
        app: downcut
    spec:
      securityContext:
        fsGroup: 65533
      imagePullSecrets:
        - name: registry-secret
      initContainers:
        - name: cookies
          image: busybox:1.36
          command: ["sh", "-c", "cp /seed/cookies.txt /work/cookies.txt"]
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
          volumeMounts:
            - name: instagram-cookies
              mountPath: /seed
              readOnly: true
            - name: cookies-work
              mountPath: /work
      containers:
      - name: downcut
        image: IMAGE_TEMPLATE
        imagePullPolicy: Always
        ports:
        - containerPort: 8787
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "60m"
          limits:
            memory: "256Mi"
            cpu: "120m"
        env:
          - name: PORT
            value: "8787"
          - name: YTDLP_COOKIES
            value: /work/cookies.txt
        volumeMounts:
          - name: cookies-work
            mountPath: /work
      volumes:
        - name: instagram-cookies
          secret:
            secretName: instagram-cookies
            defaultMode: 0440
        - name: cookies-work
          emptyDir: {}
