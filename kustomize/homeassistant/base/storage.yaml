apiVersion: v1
kind: PersistentVolume
metadata:
  name: homeassistant-config
  labels:
    service: homeassistant-config
spec:
  capacity:
    storage: 10Gi
  nfs:
    server: 192.168.0.16
    path: /mnt/pool2/AppData/homeassistant
  accessModes:
    - ReadWriteOnce
  mountOptions:
    - noatime
    - nfsvers=4.2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      service: homeassistant-config
  storageClassName: ""
