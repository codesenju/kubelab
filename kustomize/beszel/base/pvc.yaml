---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: beszel-data
  labels:
    service: beszel-data  # This matches the PVC selector
spec:
  capacity:
    storage: 1Gi
  nfs:
    server: 192.168.0.16
    path: /mnt/pool2/AppData/beszel
  accessModes:
    - ReadWriteOnce
  mountOptions:
    - noatime
    - nfsvers=4.2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beszel-data
  labels:
    app: beszel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      service: beszel-data
  storageClassName: ""
