apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/

namespace: n8n

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: pv.patch.yaml
    target:
      group: ""
      version: v1
      kind: PersistentVolume
      name: n8n-data
  - path: pvc.patch.yaml
    target:
      group: ""
      version: v1
      kind: PersistentVolumeClaim
      name: n8n-data
  - path: deployment.patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: n8n
