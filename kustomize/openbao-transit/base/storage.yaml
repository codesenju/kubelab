apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-transit-data
  labels:
    service: openbao-transit-data
spec:
  capacity:
    storage: 1Gi
  nfs:
    server: 192.168.0.16
    path: /mnt/pool2/AppData/openbao-transit
  accessModes:
    - ReadWriteOnce
  mountOptions:
    - noatime
    - nfsvers=4.2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-transit-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      service: openbao-transit-data
  storageClassName: ""
