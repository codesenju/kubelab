# Read-only cluster access for the Backstage Kubernetes plugin.
#
# The ServiceAccount (backstage/backstage) already exists in the cluster and is
# reused, so it is intentionally NOT defined here.
#
# Least privilege: get/list/watch only. NO secrets, NO pods/exec,
# NO pods/portforward, NO pods/log and NO write verbs. Add pods/log in a
# separate, commented rule only if the app enables log viewing.
#
# The Deployment runs as this ServiceAccount (serviceAccountName: backstage), and
# the Kubernetes plugin reads the cluster with its token (see the `kubernetes:`
# block in catalog/app-config.catalog.yaml). replicasets is needed to map pods to
# their Deployment. services and configmaps are deliberately not granted, so
# kubernetes.objectTypes is limited to the kinds below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-read-only
  labels:
    app: backstage
rules:
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csidrivers
      - csinodes
      - volumeattachments
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-read-only
  labels:
    app: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-read-only
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
