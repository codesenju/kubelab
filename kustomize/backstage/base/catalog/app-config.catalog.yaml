# Extra Backstage config merged after app-config.production.yaml.
# Arrays replace earlier values, so the original org and template sources are repeated here.
catalog:
  locations:
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /catalog/groups.yaml
      rules:
        - allow: [Group]
    - type: file
      target: /catalog/systems.yaml
      rules:
        - allow: [System]
    - type: file
      target: /catalog/components.yaml
      rules:
        - allow: [Component]
    - type: file
      target: /catalog/resources.yaml
      rules:
        - allow: [Resource]
    - type: file
      target: /catalog-private/users.yaml
      rules:
        - allow: [User]

# Kubernetes plugin: read the local cluster with the pod's own ServiceAccount token.
# objectTypes matches what the backstage-read-only ClusterRole grants; metrics are
# skipped because metrics.k8s.io is not granted.
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: kubelab
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          skipTLSVerify: false
          skipMetricsLookup: true
  objectTypes:
    - pods
    - replicasets
    - deployments
    - statefulsets
    - daemonsets
