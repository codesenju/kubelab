apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
      annotations:
        # Keep `kubectl exec/logs deploy/backstage` pointed at the app, not dind.
        kubectl.kubernetes.io/default-container: backstage
    spec:
      containers:
        # Docker-in-Docker sidecar for the TechDocs generator (techdocs.generator.runIn: docker).
        # Privileged. It listens only on a unix socket in a shared volume, never on TCP,
        # so nothing else in the cluster can reach it.
        - name: dind
          image: docker:29.1.3-dind@sha256:173f284a4299164772a90f52b373e73e087583c0963f1334c9995f190ef6f3f5
          # Go through the image's dind wrapper: it sets up cgroup v2 nesting and
          # shared mount propagation. Calling dockerd directly skips both.
          # Using `command` replaces the image entrypoint, so the entrypoint's
          # default TCP listener (2375) is never added.
          command:
            - dind
            - dockerd
            - --host=unix:///run/dind/docker.sock
            - --group=1000
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: dind-socket
              mountPath: /run/dind
            - name: dind-storage
              mountPath: /var/lib/docker
            # Same path as in the backstage container: the generator bind-mounts
            # its /tmp working directories into the job containers.
            - name: tmp
              mountPath: /tmp
        - name: backstage
          image: IMAGE_NAME # Replace with the actual image name
          imagePullPolicy: Always
          # Same start command as the image, plus the catalog config file.
          command:
            - node
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - app-config.production.yaml
            - --config
            - /catalog/app-config.catalog.yaml
          ports:
            - name: http
              containerPort: 7007
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres-secrets
                  key: password
            - name: POSTGRES_HOST
              value: backstage-postgres-rw.backstage.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: backstage
            # TechDocs generator talks to the dind sidecar over this socket.
            - name: DOCKER_HOST
              value: unix:///run/dind/docker.sock
            # Argo CD catalog provider (read-only identity `backstage-catalog`).
            # URL uses Service port 80 (-> argocd-server :8080). :8083 is the metrics port.
            # Token comes from the backstage-postgres-secrets Secret that addons/backstage.yaml creates.
            # optional: true so the app starts before the token is provisioned.
            - name: ARGOCD_API_URL
              value: http://argocd-server.argocd.svc.cluster.local
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres-secrets
                  key: ARGOCD_API_TOKEN
                  optional: true
          # envFrom:
          #   - secretRef:
          #       name: backstage-secrets
          volumeMounts:
            - name: catalog
              mountPath: /catalog
              readOnly: true
            - name: catalog-users
              mountPath: /catalog-private
              readOnly: true
            - name: dind-socket
              mountPath: /run/dind
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dind-socket
          emptyDir: {}
        - name: dind-storage
          emptyDir:
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: catalog
          configMap:
            name: backstage-catalog
        # Sign-in User entities. Created by addons/backstage.yaml from env vars.
        # optional so the pod still starts if the Secret is missing.
        - name: catalog-users
          secret: # reference by name only, value comes from env via addons/backstage.yaml
            secretName: backstage-catalog-users
            optional: true
      imagePullSecrets:
      - name: ghcr-regcred
