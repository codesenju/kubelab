---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha-bridge
spec:
  parentRefs:
    - name: local-gateway
      namespace: gateway-infra
  hostnames:
    - "ha-bridge.local.jazziro.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ha-bridge
          port: 80
