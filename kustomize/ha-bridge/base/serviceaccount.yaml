# ServiceAccount + read-only cluster RBAC for the Kubernetes collector in the
# bridge (kubectl get nodes / pods -A). Least privilege: read-only, cluster-wide
# but limited to nodes and pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ha-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ha-bridge-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ha-bridge-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ha-bridge-read
subjects:
  - kind: ServiceAccount
    name: ha-bridge
    namespace: homeassistant
