apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-metrics-collector
  labels:
    app: cnpg-metrics-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-metrics-collector
  labels:
    app: cnpg-metrics-collector
rules:
  # Required by the OTel Collector prometheus receiver's kubernetes_sd
  # pod discovery to find CloudNativePG instance pods across all namespaces.
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-metrics-collector
  labels:
    app: cnpg-metrics-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-metrics-collector
subjects:
  - kind: ServiceAccount
    name: cnpg-metrics-collector
    namespace: signoz
