---
- name: Crowdsec Playbook
  hosts: k8s-control-plane-1
  gather_facts: false
  vars:
    target_namespace: crowdsec
  tasks:
    - name: Create crowdsec postgres secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: crowdsec-postgres-secrets
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            username: "{{ crowdsec_db_username }}"
            password: "{{ crowdsec_db_password }}"
      tags:
        - postgres

    - name: Create s3 secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: s3-creds
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            ACCESS_KEY_ID: "{{ rustfs_access_key }}"
            SECRET_ACCESS_KEY: "{{ rustfs_secret_key }}"
      tags:
        - postgres

    - name: Create CrowdSec keys secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: crowdsec-keys
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            ENROLL_KEY: "{{ crowdsec_enroll_key }}"
            BOUNCER_KEY_traefik: "{{ crowdsec_lapi_key }}"
      tags:
        - lapi
        - secrets

    - name: Create Traefik bouncer key secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: crowdsec-bouncer-key
            namespace: traefik
          type: Opaque
          stringData:
            BOUNCER_KEY_traefik: "{{ crowdsec_lapi_key }}"
      tags:
        - lapi
        - secrets

    - name: Create Registry pull secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: registry-secret
            namespace: "{{ target_namespace }}"
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ {'auths': {'https://' + registry_domain: {'username': registry_username, 'password': registry_password, 'auth': (registry_username
              + ':' + registry_password) | b64encode}}} | to_json | b64encode }}"
      tags:
        - postgres

    - name: Deploy crowdsec postgres cluster
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kubelab.io/v1beta1
          kind: PGCluster
          metadata:
            name: crowdsec
            namespace: "{{ target_namespace }}"
          spec:
            name: crowdsec
            # db version must be compatiable with the backup db version
            # using tensorchord image that comes with vchord
            image: "{{ container_registry }}/ghcrio/cloudnative-pg/postgresql:18-standard-trixie"
            imagePullSecretName1: nexus-registry-creds
            db:
              name: crowdsec
              username: "{{ crowdsec_db_username }}"
              secretName: crowdsec-postgres-secrets
              # size: 1Gi
              storageClassName: "{{ postgres_storage_class_name }}"
            bootstrap:
              mode: initdb
            archiveDestination:
              s3Path: "s3://cnpg/backup3"
              endpointURL: "https://{{ rustfs_endpoint }}"
              # retentionPolicy: "5d"
              s3:
                credentialsSecretName: s3-creds
                accessKeyId: ACCESS_KEY_ID
                secretAccessKey: SECRET_ACCESS_KEY
            scheduledBackup:
              enabled: true
              # cron: "0 0 2 * * *"
      tags:
        - postgres

    - name: Label node for Traefik ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: k8s-worker-2
            labels:
              kubernetes.io/ingress-ready: "true"
      tags:
        - labels

    - name: Create ArgoCD Application
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: crowdsec
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: https://crowdsecurity.github.io/helm-charts
              chart: crowdsec
              targetRevision: "0.24.0"
              helm:
                releaseName: crowdsec
                values: |
                  appsec:
                    enabled: true
                    acquisitions:
                      - appsec_configs:
                          - crowdsecurity/appsec-default
                        labels:
                          type: appsec
                        listen_addr: 0.0.0.0:7422
                        path: /
                        source: appsec
                    env:
                      - name: COLLECTIONS
                        value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"

                  # for raw logs format: json or cri (docker|containerd)
                  container_runtime: containerd

                  agent:
                    # Only deploy agents on nodes running Traefik so log acquisition works
                    nodeSelector:
                      kubernetes.io/ingress-ready: "true"

                    acquisition:
                      - namespace: traefik
                        podName: traefik-*
                        program: traefik
                        poll_without_inotify: true

                    env:
                      - name: COLLECTIONS
                        value: "crowdsecurity/traefik crowdsecurity/base-http-scenarios crowdsecurity/http-cve crowdsecurity/linux crowdsecurity/sshd crowdsecurity/whitelist-good-actors"

                  lapi:
                    env:
                      - name: ENROLL_KEY
                        valueFrom:
                          secretKeyRef:
                            name: crowdsec-keys
                            key: ENROLL_KEY

                      - name: BOUNCER_KEY_traefik
                        valueFrom:
                          secretKeyRef:
                            name: crowdsec-keys
                            key: BOUNCER_KEY_traefik

                      - name: ENROLL_INSTANCE_NAME
                        value: "{{ crowdsec_enroll_instance_name }}"

                      - name: ENROLL_TAGS
                        value: "{{ crowdsec_enroll_tags }}"

                  config:

                    #
                    # Custom parser configuration
                    #
                    parsers:
                      s02-enrich:
                        whitelists.yaml: |
                          name: crowdsecurity/whitelists
                          description: "Whitelist localhost only (private IPs are NOT ignored)"
                          whitelist:
                            reason: "localhost only"
                            ip:
                              - "::1"
                            cidr:
                              - "127.0.0.0/8"

                    #
                    # CrowdSec engine configuration
                    #
                    config.yaml.local: |
                      api:
                        client:
                          unregister_on_exit: true

                        server:
                          auto_registration:
                            enabled: true
                            token: "${REGISTRATION_TOKEN}"
                            allowed_ranges:
                              - "10.0.0.0/8"
                              - "10.244.0.0/16"

                      db_config:
                        type: postgresql
                        user: "{{ crowdsec_db_username }}"
                        password: "{{ crowdsec_db_password }}"
                        db_name: "{{ crowdsec_db_name }}"
                        host: "{{ crowdsec_db_host }}"
                        port: 5432

                        flush:
                          bouncers_autodelete:
                            api_key: 1h
                          agents_autodelete:
                            login_password: 6h
                            cert: 6h

                    #
                    # Override the default remediation profile
                    #
                    profiles.yaml: |
                      name: default_ip_remediation
                      #debug: true
                      filters:
                       - Alert.Remediation == true && Alert.GetScope() == "Ip"
                      decisions:
                       - type: ban
                         duration: 72h
                      #duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
                      # notifications:
                      #   - slack_default
                      #   - splunk_default
                      #   - http_default
                      #   - email_default
                      on_success: break

                      ---
                      name: default_range_remediation
                      #debug: true
                      filters:
                       - Alert.Remediation == true && Alert.GetScope() == "Range"
                      decisions:
                       - type: ban
                         duration: 72h
                      #duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
                      # notifications:
                      #   - slack_default
                      #   - splunk_default
                      #   - http_default
                      #   - email_default
                      on_success: break
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ target_namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - RespectIgnoreDifferences=true
            ignoreDifferences: []
      tags:
        - argocd

    - name: Create CrowdSec bouncer middleware
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: crowdsec-bouncer
            namespace: "{{ item }}"
          spec:
            plugin:
              crowdsec-bouncer-traefik-plugin:
                enabled: true
                crowdsecMode: stream
                crowdsecLapiScheme: http
                crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
                crowdsecLapiKeyFile: /etc/traefik/crowdsec/BOUNCER_KEY_traefik
                htttTimeoutSeconds: 60
                forwardedheaderstrustedips:
                  - 10.0.0.0/8
                  - 192.168.0.0/16
                  - 10.244.0.0/16
                crowdsecAppsecEnabled: true
                crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
                crowdsecAppsecFailureBlock: true
                crowdsecAppsecUnreachableBlock: false
      loop: "{{ crowdsec_bouncer_namespaces }}"
      tags:
        - lapi
