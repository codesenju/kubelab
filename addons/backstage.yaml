- name: Backstage Playbook
  hosts: k8s-control-plane-1
  gather_facts: false
  vars:
    registry_server: "ghcr.io"
    registry_username: "{{ ghcr_username }}"
    registry_password: "{{ ghcr_token }}"
    registry_email: "{{ ghcr_email }}"
    # Read from the environment at run time; values never live in Git.
    backstage_db_username: "{{ lookup('env', 'BACKSTAGE_DB_USERNAME') | default('backstage', true) }}"
    backstage_db_password: "{{ lookup('env', 'BACKSTAGE_DB_PASSWORD') }}"
    backstage_argocd_api_token: "{{ lookup('env', 'BACKSTAGE_ARGOCD_API_TOKEN') }}"
  tasks:

    - name: Create backstage namespace
      kubernetes.core.k8s:
        state: present
        api_version: v1
        kind: Namespace
        name: backstage
      tags: backstage-db-secret

    - name: Require backstage secret inputs
      ansible.builtin.assert:
        that:
          - backstage_db_password | length > 0
          - backstage_argocd_api_token | length > 0
        fail_msg: "Set BACKSTAGE_DB_PASSWORD and BACKSTAGE_ARGOCD_API_TOKEN in the environment."
      no_log: true
      tags: backstage-db-secret

    - name: Create backstage postgres secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: backstage-postgres-secrets
            namespace: backstage
            labels:
              cnpg.io/reload: "true"
          type: Opaque
          stringData:
            username: "{{ backstage_db_username }}"
            password: "{{ backstage_db_password }}"
            ARGOCD_API_TOKEN: "{{ backstage_argocd_api_token }}"
      no_log: true
      tags: backstage-db-secret

    - name: Deploy backstage
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: backstage
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: https://github.com/codesenju/kubelab.git
              path: kustomize/backstage/overlays/prod
              targetRevision: main
              kustomize:
                # Keep in sync with the live Application: the OIDC env vars below
                # exist ONLY here (not in the base), so dropping them removes sign-in.
                images:
                  - "IMAGE_NAME={{ registry_domain }}/kubelab/backstage@sha256:fe8ca0553a4e6819129068fe8b9cd6010a5359f4583cffc33decd92fcec277ad"
                  - "ghcr.io/tensorchord/cloudnative-pgvecto.rs={{ registry_domain }}/kubelab/ghcrio/tensorchord/cloudnative-pgvecto.rs:16.5-v0.3.0@sha256:be3f025d79aa1b747817f478e07e71be43236e14d00d8a9eb3914146245035ba"
                patches:
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      name: backstage
                    patch: |-
                      - op: replace
                        path: /spec/template/spec/imagePullSecrets
                        value:
                          - name: registry-secret
                      # OIDC settings come from the manually created Secret
                      # `backstage-oidc` (keys: AUTH_OIDC_METADATA_URL,
                      # AUTH_OIDC_CLIENT_ID, AUTH_OIDC_CLIENT_SECRET,
                      # AUTH_SESSION_SECRET). Values never live in Git.
                      - op: add
                        path: /spec/template/spec/containers/0/env/-
                        value:
                          name: AUTH_OIDC_METADATA_URL
                          valueFrom:
                            secretKeyRef:
                              name: backstage-oidc
                              key: AUTH_OIDC_METADATA_URL
                      - op: add
                        path: /spec/template/spec/containers/0/env/-
                        value:
                          name: AUTH_OIDC_CLIENT_ID
                          valueFrom:
                            secretKeyRef:
                              name: backstage-oidc
                              key: AUTH_OIDC_CLIENT_ID
                      - op: add
                        path: /spec/template/spec/containers/0/env/-
                        value:
                          name: AUTH_OIDC_CLIENT_SECRET
                          valueFrom:
                            secretKeyRef:
                              name: backstage-oidc
                              key: AUTH_OIDC_CLIENT_SECRET
                      - op: add
                        path: /spec/template/spec/containers/0/env/-
                        value:
                          name: AUTH_SESSION_SECRET
                          valueFrom:
                            secretKeyRef:
                              name: backstage-oidc
                              key: AUTH_SESSION_SECRET
                  - target:
                      group: postgresql.cnpg.io
                      version: v1
                      kind: Cluster
                      name: backstage-postgres
                    patch: |-
                      - op: replace
                        path: /spec/imageName
                        value: "{{ registry_domain }}/ghcrio/tensorchord/cloudnative-pgvecto.rs:16.5-v0.3.0@sha256:be3f025d79aa1b747817f478e07e71be43236e14d00d8a9eb3914146245035ba"
                      - op: add
                        path: /spec/imagePullSecrets
                        value:
                          - name: registry-secret
                      - op: replace
                        path: /spec/storage/pvcTemplate/storageClassName
                        value: truenas-iscsi
                      - op: remove
                        path: /spec/storage/pvcTemplate/selector
            destination:
              server: https://kubernetes.default.svc
              namespace: backstage
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - RespectIgnoreDifferences=true
            ignoreDifferences:
              - group: "postgresql.cnpg.io"
                kind: Cluster
                jsonPointers:
                  - /spec/managed/roles

    - name: Create regcred secret for ghcr
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ghcr-regcred
            namespace: backstage
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ {'auths': { registry_server: { 'username': registry_username,
             'password': registry_password, 'email': registry_email, 'auth': (registry_username + ':'
              + registry_password)|b64encode } } } | to_nice_json | b64encode }}"
