---
- name: Authentik Playbook
  hosts: k8s-control-plane-1
  gather_facts: false
  become: false
  vars:
    target_namespace: zero-trust
  tasks:

    - name: Create namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ target_namespace }}"
      tags:
        - postgres
        - argocd
        - ingress

    - name: Create authentik postgres secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: authentik-postgres-secrets
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            username: "{{ authentik_db_username }}"
            password: "{{ authentik_db_password }}"
      tags:
        - postgres

    - name: Create s3 creds
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: s3-creds
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            ACCESS_KEY_ID: "{{ rustfs_access_key }}"
            SECRET_ACCESS_KEY: "{{ rustfs_secret_key }}"
      tags:
        - postgres

    - name: Create s3 creds for source
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: s3-creds-source
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            ACCESS_KEY_ID: "{{ rustfs_access_key_source }}"
            SECRET_ACCESS_KEY: "{{ rustfs_secret_key_source }}"
      tags:
        - postgres

    - name: Deploy postgres
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kubelab.io/v1beta1
          kind: PGCluster
          metadata:
            name: authentik
            namespace: "{{ target_namespace }}"
          spec:
            name: authentik
            # db version must be compatiable with the backup db version
            # using tensorchord image that comes with vchord
            image: "{{ registry_domain }}/ghcrio/cloudnative-pg/postgresql:18-standard-trixie"
            # image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
            imagePullSecretName1: registry-secret
            db:
              name: authentik
              username: "{{ authentik_db_username }}"
              secretName: authentik-postgres-secrets
              # size: 1Gi
              storageClassName: "{{ postgresStorageClass }}" # nfs-csi-postgres
            bootstrap:
              mode: recovery
            recovery:
              backupID: "20260818T020004" # backup will be at s3Path/serverName/base/<backupID>
              serverName: "authentik-postgres" # backup files will be at s3Path/serverName/base
            restoreSource:
              s3Path: "s3://cnpg/backup2"
              endpointURL: "https://{{ rustfs_endpoint_source }}"
              s3:
                credentialsSecretName: s3-creds-source
                accessKeyId: ACCESS_KEY_ID
                secretAccessKey: SECRET_ACCESS_KEY
            archiveDestination:
              s3Path: "s3://cnpg/backup3"
              endpointURL: "https://{{ rustfs_endpoint }}"
              # retentionPolicy: "5d"
              s3:
                credentialsSecretName: s3-creds
                accessKeyId: ACCESS_KEY_ID
                secretAccessKey: SECRET_ACCESS_KEY
            scheduledBackup:
              enabled: true
              # cron: "0 0 2 * * *"
      tags:
        - postgres

    - name: Deploy Authentik
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: authentik
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              chart: authentik
              repoURL: https://charts.goauthentik.io/
              targetRevision: 2026.8.0
              helm:
                releaseName: authentik
                values: |
                  authentik:
                    secret_key: {{ authentik_secret_key }}
                    # This sends anonymous usage-data, stack traces on errors and
                    # performance data to authentik.error-reporting.a7k.io, and is fully opt-in
                    error_reporting:
                      enabled: true
                    postgresql:
                      host: "{{ authentik_db_host }}"
                      name: "authentik" # DB name
                      user: "authentik"
                      password: "{{ authentik_db_password }}"
                      port: 5432
                  server:
                    ingress:
                      enabled: false
                  postgresql:
                    enabled: false
                  # redis:
                  #   enabled: false
                  #   master:
                  #     persistence:
                  #       enabled: true
                  #       existingClaim: authentik-redis
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ target_namespace }}"
            syncPolicy:
              automated:
                prune: false
                selfHeal: false
              syncOptions:
                - CreateNamespace=true
      tags:
        - argocd

    - name: Create HTTPRoute for authentik
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: authentik
            namespace: "{{ target_namespace }}"
          spec:
            parentRefs:
              - name: local-gateway
                namespace: "{{ gatewayapi_namespace }}"
            hostnames:
              - "auth.{{ public_dns_2 }}"
            rules:
              - backendRefs:
                  - name: authentik-server
                    port: 80
      tags:
        - ingress
        - httproute
