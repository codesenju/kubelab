---
- name: Deploy Hindsight memory API for Obito
  hosts: k8s-control-plane-1
  gather_facts: false
  become: false
  vars:
    target_namespace: hindsight
    openbao_secret_path: secret/agents/hindsight
    openbao_addr: "https://openbao.{{ local_dns }}"
    hindsight_db_username: hindsight
    hindsight_domain: "hindsight.{{ local_dns }}"
    hindsight_omniroute_url: "https://omniroute.{{ local_dns }}/v1"
    hindsight_omniroute_model: github/gpt-6-luna
    hindsight_pg_image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
    hindsight_pgvector_image: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie
    hindsight_pve_ssh_key: "{{ lookup('env', 'HOME') }}/codesenju/kubelab.pem"
  environment:
    BAO_ADDR: "{{ openbao_addr }}"

  pre_tasks:
    - name: Require local DNS and RustFS backup settings
      ansible.builtin.assert:
        that:
          - local_dns is defined
          - rustfs_endpoint is defined
          - rustfs_access_key is defined
          - rustfs_secret_key is defined
        fail_msg: "Production inventory must provide local_dns and RustFS credentials."
      no_log: true

    - name: Read Hermes infrastructure settings from OpenBao
      ansible.builtin.command:
        argv: [bao, kv, get, -format=json, secret/agents/hermes]
      delegate_to: localhost
      register: hermes_bao
      changed_when: false
      no_log: true
      tags: [hermes, secrets]

    - name: Parse Hermes infrastructure settings
      ansible.builtin.set_fact:
        hermes_bao_data: "{{ (hermes_bao.stdout | from_json).data.data }}"
        hindsight_pve_ssh_host: >-
          {{ (hermes_bao.stdout | from_json).data.data.pve_api_endpoint
          | regex_replace('^https?://', '') | regex_replace('/.*$', '')
          | regex_replace(':[0-9]+$', '') }}
      no_log: true
      tags: [hermes, secrets]

    - name: Require Proxmox endpoint for Obito LXC integration
      ansible.builtin.assert:
        that:
          - hermes_bao_data.pve_api_endpoint is defined
          - hindsight_pve_ssh_host | length > 0
        fail_msg: "OpenBao secret/agents/hermes must provide pve_api_endpoint."
      no_log: true
      tags: [hermes, secrets]

    - name: Read Hindsight credentials from OpenBao
      ansible.builtin.command:
        argv: [bao, kv, get, -format=json, "{{ openbao_secret_path }}"]
      delegate_to: localhost
      register: hindsight_bao
      changed_when: false
      no_log: true
      tags: [secrets, postgres]

    - name: Parse Hindsight credentials
      ansible.builtin.set_fact:
        hindsight_bao_data: "{{ (hindsight_bao.stdout | from_json).data.data }}"
      no_log: true
      tags: [secrets, postgres]

    - name: Verify required Hindsight credentials
      ansible.builtin.assert:
        that:
          - hindsight_bao_data.omniroute_api_key is defined
          - hindsight_bao_data.hindsight_db_password is defined
          - hindsight_bao_data.hindsight_api_key is defined
          - hindsight_bao_data.hindsight_cp_access_key is defined
          - hindsight_bao_data.hindsight_cp_access_key | length > 0
        fail_msg: "Required Hindsight credentials are missing from OpenBao."
      no_log: true
      tags: [secrets, postgres]

  tasks:
    - name: Ensure Hindsight namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ target_namespace }}"
      tags: [postgres, secrets, argocd, verify]

    - name: Create PostgreSQL bootstrap credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: hindsight-postgres-auth
            namespace: "{{ target_namespace }}"
          type: kubernetes.io/basic-auth
          stringData:
            username: "{{ hindsight_db_username }}"
            password: "{{ hindsight_bao_data.hindsight_db_password }}"
      no_log: true
      tags: [postgres, secrets]

    - name: Create Hindsight RustFS backup credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: hindsight-s3-creds
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            ACCESS_KEY_ID: "{{ rustfs_access_key }}"
            SECRET_ACCESS_KEY: "{{ rustfs_secret_key }}"
            REGION: "{{ rustfs_region | default('joburg-north-1') }}"
      no_log: true
      tags: [postgres, secrets]

    - name: Configure CNPG RustFS object store
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: barmancloud.cnpg.io/v1
          kind: ObjectStore
          metadata:
            name: hindsight-backup
            namespace: "{{ target_namespace }}"
          spec:
            configuration:
              destinationPath: s3://cnpg/new-backups/hindsight-postgres
              endpointURL: "https://{{ rustfs_endpoint }}"
              s3Credentials:
                accessKeyId:
                  name: hindsight-s3-creds
                  key: ACCESS_KEY_ID
                secretAccessKey:
                  name: hindsight-s3-creds
                  key: SECRET_ACCESS_KEY
                region:
                  name: hindsight-s3-creds
                  key: REGION
              wal:
                compression: gzip
              data:
                compression: gzip
                jobs: 2
            retentionPolicy: 14d
      tags: [postgres]

    - name: Deploy dedicated Hindsight PostgreSQL cluster with pgvector
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: hindsight-postgres
            namespace: "{{ target_namespace }}"
          spec:
            imageName: "{{ hindsight_pg_image }}"
            instances: 1
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi
            postgresql:
              parameters:
                max_connections: "100"
              extensions:
                - name: pgvector
                  image:
                    reference: "{{ hindsight_pgvector_image }}"
            bootstrap:
              initdb:
                database: hindsight
                owner: "{{ hindsight_db_username }}"
                secret:
                  name: hindsight-postgres-auth
                postInitApplicationSQL:
                  - CREATE EXTENSION IF NOT EXISTS vector;
            storage:
              size: 10Gi
              pvcTemplate:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
                storageClassName: truenas-iscsi
            plugins:
              - name: barman-cloud.cloudnative-pg.io
                isWALArchiver: true
                parameters:
                  barmanObjectName: hindsight-backup
      tags: [postgres]

    - name: Schedule daily Hindsight PostgreSQL backup
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: postgresql.cnpg.io/v1
          kind: ScheduledBackup
          metadata:
            name: hindsight-postgres-daily
            namespace: "{{ target_namespace }}"
          spec:
            schedule: "0 0 2 * * *"
            cluster:
              name: hindsight-postgres
            immediate: true
            backupOwnerReference: self
            method: plugin
            pluginConfiguration:
              name: barman-cloud.cloudnative-pg.io
      tags: [postgres]

    - name: Wait for Hindsight PostgreSQL cluster readiness
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        name: hindsight-postgres
        namespace: "{{ target_namespace }}"
      register: hindsight_pg
      until:
        - hindsight_pg.resources | length == 1
        - hindsight_pg.resources[0].status.phase | default('') == 'Cluster in healthy state'
      retries: 60
      delay: 10
      tags: [postgres, verify]

    - name: Create Hindsight runtime credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: hindsight-runtime
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            postgres-password: "{{ hindsight_bao_data.hindsight_db_password }}"
            HINDSIGHT_API_LLM_API_KEY: "{{ hindsight_bao_data.omniroute_api_key }}"
            HINDSIGHT_API_TENANT_API_KEY: "{{ hindsight_bao_data.hindsight_api_key }}"
            HINDSIGHT_CP_DATAPLANE_API_KEY: "{{ hindsight_bao_data.hindsight_api_key }}"
            HINDSIGHT_CP_ACCESS_KEY: "{{ hindsight_bao_data.hindsight_cp_access_key }}"
      no_log: true
      tags: [secrets]

    - name: Deploy Hindsight Helm chart through Argo CD
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: hindsight
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: ghcr.io/vectorize-io/charts
              chart: hindsight
              targetRevision: "1.2.1"
              helm:
                releaseName: hindsight
                values: |
                  version: "1.2.1"
                  existingSecret: hindsight-runtime
                  api:
                    replicaCount: 1
                    automountServiceAccountToken: false
                    resources:
                      requests:
                        cpu: 500m
                        memory: 2Gi
                      limits:
                        cpu: "2"
                        memory: 4Gi
                    persistence:
                      modelCache:
                        enabled: true
                        size: 5Gi
                        storageClass: truenas-iscsi
                    env:
                      HINDSIGHT_API_LLM_PROVIDER: openai
                      HINDSIGHT_API_LLM_MODEL: "{{ hindsight_omniroute_model }}"
                      HINDSIGHT_API_LLM_BASE_URL: "{{ hindsight_omniroute_url }}"
                      HINDSIGHT_API_TENANT_EXTENSION: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
                    secrets: {}
                  controlPlane:
                    enabled: true
                  worker:
                    enabled: false
                  postgresql:
                    enabled: false
                    external:
                      host: hindsight-postgres-rw.hindsight.svc.cluster.local
                      port: 5432
                      database: hindsight
                      username: hindsight
                  gatewayApi:
                    enabled: true
                    parentRefs:
                      - name: local-gateway
                        namespace: gateway-infra
                        sectionName: websecure-pvt
                    hostnames:
                      - "{{ hindsight_domain }}"
                    paths:
                      - path: /
                        service: controlPlane
                      - path: /v1
                        service: api
                      - path: /mcp
                        service: api
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ target_namespace }}"
            ignoreDifferences:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: hindsight
                namespace: "{{ target_namespace }}"
                jqPathExpressions:
                  - .spec.parentRefs[]
                  - .spec.rules[].backendRefs[].group
                  - .spec.rules[].backendRefs[].kind
                  - .spec.rules[].backendRefs[].weight
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - RespectIgnoreDifferences=true
      tags: [argocd]

    - name: Wait for Hindsight Argo application to become healthy
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: hindsight
        namespace: argocd
      register: hindsight_app
      until:
        - hindsight_app.resources | length == 1
        - hindsight_app.resources[0].status.sync.status | default('') == 'Synced'
        - hindsight_app.resources[0].status.health.status | default('') == 'Healthy'
      retries: 90
      delay: 10
      tags: [argocd, verify]

    - name: Wait for Hindsight API rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: hindsight-api
        namespace: "{{ target_namespace }}"
      register: hindsight_api_deploy
      until:
        - hindsight_api_deploy.resources | length == 1
        - hindsight_api_deploy.resources[0].status.readyReplicas | default(0) | int > 0
      retries: 90
      delay: 10
      tags: [verify]

    - name: Check whether Obito already has the Hindsight Hermes plugin
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -i
          - "{{ hindsight_pve_ssh_key }}"
          - "root@{{ hindsight_pve_ssh_host }}"
          - pct
          - exec
          - "106"
          - --
          - test
          - -d
          - /root/.hermes/plugins/hindsight
      delegate_to: localhost
      register: hindsight_plugin_directory
      changed_when: false
      failed_when: false
      tags: [hermes]

    - name: Install Hindsight memory provider in Obito
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -i
          - "{{ hindsight_pve_ssh_key }}"
          - "root@{{ hindsight_pve_ssh_host }}"
          - pct
          - exec
          - "106"
          - --
          - /root/.local/bin/hermes
          - plugins
          - install
          - hindsight
          - --enable
          - --yes-deps
      delegate_to: localhost
      register: hindsight_plugin_install
      when: hindsight_plugin_directory.rc != 0
      changed_when: true
      tags: [hermes]

    - name: Prepare Obito provider configuration script
      ansible.builtin.set_fact:
        obito_config_script: |
            import fcntl, json, os, stat, sys, tempfile
            from pathlib import Path
            data = json.load(sys.stdin)
            home = Path('/root/.hermes')
            env_path = home / '.env'
            lock_path = home / '.env.lock'
            changed = False
            with lock_path.open('a') as lock:
                fcntl.flock(lock, fcntl.LOCK_EX)
                lines = env_path.read_text().splitlines() if env_path.exists() else []
                key_lines = [line for line in lines if line.startswith(('HINDSIGHT_API_KEY=', 'export HINDSIGHT_API_KEY='))]
                if key_lines != ['HINDSIGHT_API_KEY=' + data['api_key']]:
                    lines = [line for line in lines if not line.startswith(('HINDSIGHT_API_KEY=', 'export HINDSIGHT_API_KEY='))]
                    lines.append('HINDSIGHT_API_KEY=' + data['api_key'])
                    env_text = '\n'.join(lines) + '\n'
                    fd, temp_path = tempfile.mkstemp(prefix='.env.', dir=str(home))
                    try:
                        with os.fdopen(fd, 'w') as stream:
                            stream.write(env_text)
                            stream.flush()
                            os.fsync(stream.fileno())
                        os.chmod(temp_path, 0o600)
                        os.replace(temp_path, env_path)
                    finally:
                        if os.path.exists(temp_path):
                            os.unlink(temp_path)
                    changed = True
            config_dir = home / 'hindsight'
            config_dir.mkdir(mode=0o700, parents=True, exist_ok=True)
            config_path = config_dir / 'config.json'
            config = json.loads(config_path.read_text()) if config_path.exists() else {}
            removed_inline_key = 'api_key' in config or 'apiKey' in config
            config.pop('api_key', None)
            config.pop('apiKey', None)
            desired = {
                'mode': 'local_external',
                'api_url': data['api_url'],
                'bank_id': 'obito',
                'auto_retain': True,
                'auto_recall': True,
                'retain_async': True,
                'memory_mode': 'hybrid',
                'recall_budget': 'mid',
            }
            if removed_inline_key or any(config.get(key) != value for key, value in desired.items()):
                config.update(desired)
                fd, temp_path = tempfile.mkstemp(prefix='.config.json.', dir=str(config_dir))
                try:
                    with os.fdopen(fd, 'w') as stream:
                        json.dump(config, stream, indent=2)
                        stream.write('\n')
                        stream.flush()
                        os.fsync(stream.fileno())
                    os.chmod(temp_path, 0o600)
                    os.replace(temp_path, config_path)
                finally:
                    if os.path.exists(temp_path):
                        os.unlink(temp_path)
                changed = True
            print('changed' if changed else 'unchanged')
      tags: [hermes, secrets]

    - name: Write Obito's Hindsight API key and provider configuration
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -i
          - "{{ hindsight_pve_ssh_key }}"
          - "root@{{ hindsight_pve_ssh_host }}"
          - pct
          - exec
          - "106"
          - --
          - python3
          - -c
          - "{{ obito_config_script | quote }}"
        stdin: "{{ {'api_key': hindsight_bao_data.hindsight_api_key, 'api_url': 'https://' ~ hindsight_domain} | to_json }}"
      delegate_to: localhost
      register: obito_hindsight_config
      changed_when: "obito_hindsight_config.stdout.strip() == 'changed'"
      no_log: true
      tags: [hermes, secrets]

    - name: Check Obito's current Hermes memory provider
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -i
          - "{{ hindsight_pve_ssh_key }}"
          - "root@{{ hindsight_pve_ssh_host }}"
          - pct
          - exec
          - "106"
          - --
          - /root/.local/bin/hermes
          - memory
          - status
      delegate_to: localhost
      register: obito_memory_status_before
      changed_when: false
      no_log: true
      tags: [hermes]

    - name: Activate Hindsight as Obito's memory provider
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -i
          - "{{ hindsight_pve_ssh_key }}"
          - "root@{{ hindsight_pve_ssh_host }}"
          - pct
          - exec
          - "106"
          - --
          - /root/.local/bin/hermes
          - config
          - set
          - memory.provider
          - hindsight
      delegate_to: localhost
      when: "obito_memory_status_before.stdout is not regex('Provider:\\s+hindsight')"
      register: obito_activate_hindsight
      changed_when: true
      tags: [hermes]

    - name: Restart Obito gateway to load Hindsight memory provider
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -i
          - "{{ hindsight_pve_ssh_key }}"
          - "root@{{ hindsight_pve_ssh_host }}"
          - pct
          - exec
          - "106"
          - --
          - /root/.local/bin/hermes
          - gateway
          - restart
      delegate_to: localhost
      when: >-
        hindsight_plugin_install is changed or
        obito_hindsight_config is changed or
        obito_activate_hindsight is changed
      changed_when: true
      tags: [hermes]

    - name: Verify Obito memory provider status
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -i
          - "{{ hindsight_pve_ssh_key }}"
          - "root@{{ hindsight_pve_ssh_host }}"
          - pct
          - exec
          - "106"
          - --
          - /root/.local/bin/hermes
          - memory
          - status
      delegate_to: localhost
      register: obito_memory_status
      changed_when: false
      failed_when: "obito_memory_status.stdout is not regex('Provider:\\s+hindsight')"
      tags: [hermes, verify]
