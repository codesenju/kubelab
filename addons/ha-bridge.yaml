---
# KUBELAB HA metrics bridge — deploys the Proxmox/K8s/temperature -> Home
# Assistant bridge (previously run via launchd on a Mac) into the cluster in the
# `homeassistant` namespace, exposed at ha-bridge.{{ local_dns }}.
#
# Secrets are read from OpenBao (single source of truth) at play time and
# materialised as Kubernetes Secrets; nothing sensitive is committed to git.
#
# Run:
#   cd ansible && export ANSIBLE_CONFIG=ansible.cfg
#   ansible-playbook ../addons/ha-bridge.yaml -i inventories/prod/hosts.ini
- name: HA Bridge Playbook
  # Runs on the Ansible control node (localhost): it has the OpenBao CLI logged
  # in, the SSH key for temperature collection, and a working kubeconfig. This
  # mirrors nexus.yaml's intent (control-plane host) but keeps the OpenBao read
  # where the `bao` token actually lives.
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_namespace: homeassistant
    openbao_addr: "https://openbao.{{ local_dns | default('local.jazziro.com') }}"
    # Path on the Ansible control node to the SSH key used for lm-sensors
    # temperature collection on the Proxmox nodes.
    temp_ssh_key_path: "{{ lookup('env', 'HOME') }}/codesenju/kubelab.pem"
  environment:
    BAO_ADDR: "{{ openbao_addr }}"

  tasks:
    - name: Read Home Assistant creds from OpenBao
      ansible.builtin.command: bao kv get -format=json secret/agents/homeassistant
      register: bao_ha
      changed_when: false
      tags: [secrets]

    - name: Read Proxmox monitoring creds from OpenBao
      ansible.builtin.command: bao kv get -format=json secret/agents/proxmox-monitoring
      register: bao_pve
      changed_when: false
      tags: [secrets]

    - name: Parse OpenBao payloads
      ansible.builtin.set_fact:
        ha_data: "{{ (bao_ha.stdout | from_json).data.data }}"
        pve_data: "{{ (bao_pve.stdout | from_json).data.data }}"
      tags: [secrets]

    - name: Read SSH key for temperature collection (from control node)
      ansible.builtin.slurp:
        src: "{{ temp_ssh_key_path }}"
      register: temp_ssh_key
      tags: [secrets]

    - name: Create ha-bridge application secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ha-bridge-secrets
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            HA_URL: "{{ ha_data.url }}"
            HA_TOKEN: "{{ ha_data.api_key }}"
            PVE_HOST: "{{ pve_data.pve_host }}"
            PVE_TOKEN_ID: "{{ pve_data.pve_token_id }}"
            PVE_TOKEN_SECRET: "{{ pve_data.pve_token_secret }}"
            PVE_FINGERPRINT: "{{ pve_data.pve_fingerprint }}"
      no_log: true
      tags: [secrets]

    - name: Create ha-bridge SSH key secret (temperature collection)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ha-bridge-ssh
            namespace: "{{ target_namespace }}"
          type: Opaque
          data:
            # Mounted read-only at /etc/ha-bridge-ssh/kubelab.pem (mode 0400).
            kubelab.pem: "{{ temp_ssh_key.content }}"
      no_log: true
      tags: [secrets]

    - name: Deploy ha-bridge via ArgoCD
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ha-bridge
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: https://github.com/codesenju/kubelab.git
              path: kustomize/ha-bridge/overlays/prod
              targetRevision: main
              kustomize:
                commonAnnotations:
                  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
                labels:
                  app.kubernetes.io/instance: ha-bridge
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ target_namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - RespectIgnoreDifferences=true
            # The Gateway API controller defaults parentRefs[].group/kind and
            # backendRefs[].group/kind/weight on the live HTTPRoute, which our
            # manifest omits. Ignore those so the app doesn't sit OutOfSync.
            ignoreDifferences:
              - group: "gateway.networking.k8s.io"
                kind: HTTPRoute
                name: ha-bridge
                jqPathExpressions:
                  - .spec.parentRefs[]
                  - .spec.rules[].backendRefs[]
      tags: [argocd]
