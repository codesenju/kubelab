- name: Gitlab Runners
  hosts: k8s-control-plane-1
  become: false
  gather_facts: false
  vars:
    target_namespace: gitlab
  tasks:

    - name: Deploy Gitlab Agent
      kubernetes.core.k8s:
        state: absent
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: gitlab-agent
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              chart: gitlab-agent
              repoURL: https://charts.gitlab.io
              targetRevision: 2.22.1
              helm:
                releaseName: gitlab-agent
                values: |
                  config:
                    token: "{{ gitlab_agent_token }}"
                    kasAddress: wss://kas.gitlab.com
            destination:
              server: https://kubernetes.default.svc
              namespace: '{{ target_namespace }}'
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
      when: false

    - name: Deploy Gitlab Runner
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: gitlab-runner
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              chart: gitlab-runner
              repoURL: https://charts.gitlab.io
              targetRevision: 0.84.2
              helm:
                releaseName: gitlab-runner
                values: |
                  rbac:
                    create: true
                  runnerToken: '{{ gitlab_runner_token }}'
                  gitlabUrl: 'https://gitlab.com/'
                  runners:
                    config: |
                      [[runners]]
                        shell = "bash"
                        name = "kubelab-runner"
                        [runners.kubernetes]
                        image = "ubuntu:24.04"
                        privileged = true
                        pull_policy = ["always", "if-not-present"]
                        # helper_image = "registry.gitlab.com/gitlab-org/gitlab-runner/gitlab-runner-helper:arm64-v18.7.2"

                        [runners.cache]
                          Type = "s3"
                          Shared = true

                          [runners.cache.s3]
                            ServerAddress = "{{ rustfs_endpoint }}"
                            AccessKey = "{{ rustfs_access_key }}"
                            SecretKey = "{{ rustfs_secret_key }}"
                            BucketName = "gitlab-runner-cache"
                            BucketLocation = "us-east-1"
                            Insecure = false
                            AuthenticationType = "access-key"
            destination:
              server: https://kubernetes.default.svc
              namespace: '{{ target_namespace }}'
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
      tags:
        - gitlab
