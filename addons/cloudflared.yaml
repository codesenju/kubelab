---
- name: Cloudflared Playbook
  hosts: k8s-control-plane-1
  gather_facts: false
  become: false
  vars:
    target_namespace: cloudflared
  tasks:
    - name: Create tunnel token secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: tunnel-token
            namespace: "{{ target_namespace }}"
          stringData:
            token: "{{ cf_tunnel_token }}"
      tags:
        - secrets

    - name: Deploy Cloudflared
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cloudflared
            namespace: "{{ target_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                pod: cloudflared
            template:
              metadata:
                labels:
                  pod: cloudflared
              spec:
                securityContext:
                  sysctls:
                    # Allows ICMP traffic (ping, traceroute) to resources behind cloudflared.
                    - name: net.ipv4.ping_group_range
                      value: "65532 65532"
                containers:
                  - image: cloudflare/cloudflared:2026.10.5
                    name: cloudflared
                    resources:
                      requests:
                        cpu: 25m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 128Mi
                    env:
                      # Defines an environment variable for the tunnel token.
                      - name: TUNNEL_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: tunnel-token
                            key: token
                    command:
                      # Configures tunnel run parameters
                      - cloudflared
                      - tunnel
                      - --protocol
                      - http2
                      - --no-autoupdate
                      - --loglevel
                      - info
                      - --metrics
                      - 0.0.0.0:2000
                      - run
                    livenessProbe:
                      httpGet:
                        # Cloudflared has a /ready endpoint which returns 200 if and only if
                        # it has an active connection to Cloudflare's network.
                        path: /ready
                        port: 2000
                      failureThreshold: 1
                      initialDelaySeconds: 10
                      periodSeconds: 10
      tags:
        - argocd
