---
- name: Nexus Playbook
  hosts: k8s-control-plane-1
  gather_facts: false
  vars:
    target_namespace: nexus
  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ target_namespace }}"

    - name: Create nexus postgres secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: nexus-postgres-secrets
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            username: "{{ nexus_db_username }}"
            password: "{{ nexus_db_password }}"
      tags:
        - postgres

    - name: Create postgres secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: s3-creds
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            ACCESS_KEY_ID: "{{ rustfs_access_key }}"
            SECRET_ACCESS_KEY: "{{ rustfs_secret_key }}"
            REGION: "joburg-north-1"
      tags:
        - postgres

    - name: Deploy postgres
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kubelab.io/v1beta1
          kind: PGCluster
          metadata:
            name: nexus
            namespace: "{{ target_namespace }}"
          spec:
            name: nexus
            # db version must be compatiable with the backup db version
            # using tensorchord image that comes with vchord
            # image: ghcr.io/cloudnative-pg/postgresql:16-standard-trixie
            db:
              name: nexus
              username: "{{ nexus_db_username }}"
              secretName: nexus-postgres-secrets
              # Bumped from the 10Gi default: WAL filled the PGDATA volume while
              # S3 archiving was failing (missing creds), crash-looping Postgres
              # with "no free disk space for WALs". 20Gi gives WAL headroom.
              size: 20Gi
              storageClassName: truenas-nvmeof
              maxConnections: "200" # Nexus HikariCP pool saturates the default 100
            bootstrap:
              mode: initdb
            # NOTE: one-time recovery onto truenas-nvmeof was performed live from
            # s3://cnpg/backup3 (serverName nexus-postgres, base 20261031T051008).
            # Keep mode=initdb here so routine playbook runs do NOT re-trigger a
            # restore from a stale backup.
            archiveDestination:
              s3Path: "s3://cnpg/backup3"
              endpointURL: "https://{{ rustfs_endpoint }}"
              # retentionPolicy: "5d"
              s3:
                credentialsSecretName: s3-creds
                accessKeyId: ACCESS_KEY_ID
                secretAccessKey: SECRET_ACCESS_KEY
            scheduledBackup:
              enabled: true
              # cron: "0 0 2 * * *"
      tags:
        - postgres

    - name: Deploy nexus
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: nexus
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: https://github.com/codesenju/kubelab.git
              path: kustomize/nexus/overlays/prod
              targetRevision: main
              kustomize:
                # Add these to your existing kustomize config
                labels:
                  app.kubernetes.io/instance: nexus
                patches:
                  - target:
                      group: gateway.networking.k8s.io
                      version: v1
                      kind: HTTPRoute
                      name: nexus-repo
                    patch: |-
                      - op: replace
                        path: /spec/hostnames
                        value:
                          - "nexus.{{ local_dns }}"
                          - "registry.{{ local_dns }}"
                          - "nexus.{{ public_dns }}"
                          - "registry.{{ public_dns }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ target_namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - RespectIgnoreDifferences=true
            ignoreDifferences:
              - group: "gateway.networking.k8s.io"
                kind: HTTPRoute
                name: nexus-repo
                jqPathExpressions:
                  - .spec.parentRefs[]
                  - .spec.rules[]
      tags:
        - argocd

    - name: Deploy nexus
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: nexus-repo
            namespace: "{{ target_namespace }}"
          spec:
            hostnames:
              - nexus.{{ local_dns }}
              - registry.{{ local_dns }}
              - nexus.{{ public_dns }}
              - registry.{{ public_dns }}
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: local-gateway
                namespace: gateway-infra
            rules:
              - backendRefs:
                  - group: ""
                    kind: Service
                    name: nexus-repo
                    port: 80
                    weight: 1
                matches:
                  - path:
                      type: PathPrefix
                      value: /
      tags:
        - httproute
