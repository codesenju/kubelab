---
- name: Signoz Playbook
  hosts: k8s-control-plane-1
  become: false
  gather_facts: false
  vars:
    target_namespace: signoz
  tasks:
    - name: Deploy signoz postgres
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kubelab.io/v1beta1
          kind: PGCluster
          metadata:
            name: signoz
            namespace: "{{ target_namespace }}"
          spec:
            name: signoz
            image: "{{ registry_domain }}/ghcrio/cloudnative-pg/postgresql:18-minimal-trixie" # db version must be compatiable with the backup db version
            imagePullSecretName1: registry-secret
            db:
              name: signoz
              username: "{{ signoz_db_username }}"
              secretName: signoz-postgres-secrets
              # size: 1Gi
              storageClassName: nfs-csi-postgres
            bootstrap:
              mode: initdb
            archiveDestination:
              s3Path: "s3://cnpg/backup3"
              endpointURL: "https://{{ rustfs_endpoint }}"
              # retentionPolicy: "5d"
              s3:
                credentialsSecretName: s3-creds
                accessKeyId: ACCESS_KEY_ID
                secretAccessKey: SECRET_ACCESS_KEY
            scheduledBackup:
              enabled: true
              # cron: "0 0 2 * * *"
      tags:
        - postgres

    - name: Create coder postgres secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: s3-creds
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            ACCESS_KEY_ID: "{{ rustfs_access_key }}"
            SECRET_ACCESS_KEY: "{{ rustfs_secret_key }}"
      tags:
        - postgres

    - name: Create signoz postgres secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: signoz-postgres-secrets
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            username: "{{ signoz_db_username }}"
            password: "{{ signoz_db_password }}"
      tags:
        - postgres

    - name: Deploy Signoz
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: signoz
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              chart: signoz
              repoURL: https://charts.signoz.io
              targetRevision: 0.139.0
              helm:
                releaseName: signoz
                values: |
                  signoz:
                    imagePullSecrets:
                      - dockerhub-secret
                    env:
                      signoz_telemetrystore_provider: clickhouse
                      signoz_emailing_enabled: false
                      signoz_alertmanager_provider: signoz
                      signoz_alertmanager_signoz_external__url: "{{ signoz_host }}"
                      signoz_sqlstore_proviser: postgres
                      signoz_sqlstore_postgres_dsn: "{{ signoz_sqlstore_postgres_dsn }}"
                  global:
                    storageClass: nfs-csi
                    clusterName: kubelab
                  imagePullSecrets:
                    - dockerhub-secret
                  # ClickHouse optimization
                  clickhouse:
                    initContainers:
                      udf:
                        enabled: false
                    coldStorage:
                      enabled: true
                      # Set free space size on default disk in bytes
                      defaultKeepFreeSpaceBytes: "10485760" # 10MiB
                      type: s3
                      endpoint: "https://{{ rustfs_endpoint }}/signoz-data/"
                      accessKey: "{{ rustfs_access_key }}"
                      secretAccess: "{{ rustfs_secret_key }}"
                    storageClass: nfs-csi
                    imagePullSecrets:
                      - dockerhub-secret
                    persistence:
                      size: 20Gi
                    resources:
                      requests:
                        cpu: 1
                        memory: 4Gi
                      limits:
                        cpu: 2
                        memory: 8Gi
                    # HA Config
                    layout:
                      shardsCount: 1 # Perfomance
                      replicasCount: 1 # HA
                    zookeeper:
                      replicaCount: 1
                    schemaMigrator:
                      enableReplication: false
                    # podDistribution:
                    #   # All instances in unique nodes:
                    #   - type: ClickHouseAntiAffinity
                    #     topologyKey: kubernetes.io/hostname
                    #   # Distribute shards of replicas across nodes:
                    #   - type: ReplicaAntiAffinity
                    #     topologyKey: kubernetes.io/hostname
                    #   # Distribute replicas of shards across nodes:
                    #   - type: ShardAntiAffinity
                    #     topologyKey: kubernetes.io/hostname
                    # Increase write buffer and merge settings
                    configOverride: |
                      <clickhouse>
                        <!-- Keep ClickHouse below its 4Gi container limit during startup. -->
                        <max_server_memory_usage>2147483648</max_server_memory_usage>
                        <max_memory_usage>1073741824</max_memory_usage>
                        <uncompressed_cache_size>268435456</uncompressed_cache_size>
                        <mark_cache_size>268435456</mark_cache_size>
                        <primary_index_cache_size>134217728</primary_index_cache_size>
                        <index_mark_cache_size>134217728</index_mark_cache_size>
                        <vector_similarity_index_cache_size>67108864</vector_similarity_index_cache_size>
                        <background_pool_size>8</background_pool_size>
                        <background_schedule_pool_size>8</background_schedule_pool_size>
                        <max_concurrent_queries>200</max_concurrent_queries>
                        <max_table_size_to_drop>0</max_table_size_to_drop>
                        <max_partition_size_to_drop>0</max_partition_size_to_drop>
                        <merge_tree>
                          <max_bytes_to_merge_at_max_space_in_pool>161061273600</max_bytes_to_merge_at_max_space_in_pool>
                          <parts_to_throw_insert>3000</parts_to_throw_insert>
                          <parts_to_delay_insert>1000</parts_to_delay_insert>
                        </merge_tree>
                      </clickhouse>

                  # OTel Collector optimization
                  otelCollector:
                    imagePullSecrets:
                      - dockerhub-secret
                    service:
                      type: ClusterIP
                    resources:
                      requests:
                        cpu: 500m
                        memory: 1Gi
                      limits:
                        cpu: 1000m
                        memory: 2Gi
                    config:
                      exporters:
                        clickhousetraces:
                          timeout: 30s
                          sending_queue:
                            enabled: true
                            num_consumers: 10
                            queue_size: 2000
                          retry_on_failure:
                            enabled: true
                            initial_interval: 5s
                            max_interval: 30s
                            max_elapsed_time: 300s
                        clickhouselogsexporter:
                          timeout: 30s
                          sending_queue:
                            enabled: true
                            num_consumers: 20
                            queue_size: 5000
                      processors:
                        batch:
                          timeout: 5s
                          send_batch_size: 5000
                          send_batch_max_size: 10000
            destination:
              server: https://kubernetes.default.svc
              namespace: signoz
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
      tags:
        - argocd

    - name: Create Docker pull secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: dockerhub-secret
            namespace: "{{ target_namespace }}"
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson:
              "{{ {'auths': {'https://index.docker.io/v1/': {'username': docker_username, 'password': docker_password, 'auth': (docker_username +
              ':' + docker_password) | b64encode}}} | to_json | b64encode }}"

    - name: Deploy Signoz k8s-infra
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: signoz-k8s-infra
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              chart: k8s-infra
              repoURL: https://charts.signoz.io
              targetRevision: 0.17.0
              helm:
                releaseName: signoz-k8s-infra
                values: |
                  global:
                    cloud: others
                    clusterName: "kubelab"
                    storageClass: "nfs-csi"
                    deploymentEnvironment: prod
                    imagePullSecrets:
                      - "dockerhub-secret"
                  otelCollectorEndpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318
                  otelInsecure: true
                  insecureSkipVerify: true
                  otelAgent:
                    ports:
                      otlp:
                        hostPort: ""
                      otlp-http:
                        hostPort: ""
                      metrics:
                        hostPort: ""
                      health-check:
                        hostPort: ""
                  presets:
                    otlpExporter:
                      enabled: true
                    loggingExporter:
                      enabled: false
                    hostMetrics:
                      enabled: true
                      collectionInterval: 30s
                    hostPort:
                      enabled: false
                    logsCollection:
                      enabled: true
                      blacklist:
                        enabled: true
                        namespaces:
                          - kube-system
                    kubeletMetrics:
                      enabled: true
                      otelInsecure: true
                      insecureSkipVerify: true
                    kubernetesAttributes:
                      enabled: true
                      otelInsecure: true
                      insecureSkipVerify: true
                    clusterMetrics:
                      enabled: true
                      otelInsecure: true
                      insecureSkipVerify: true
                    k8sEvents:
                      enabled: true
                      otelInsecure: true
                      insecureSkipVerify: true
            destination:
              server: https://kubernetes.default.svc
              namespace: signoz
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
      tags:
        - argocd

    - name: Create HTTPRoute
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: signoz
            namespace: "{{ target_namespace }}"
          spec:
            parentRefs:
              - name: local-gateway
                namespace: gateway-infra
            hostnames:
              - "signoz.{{ local_dns }}"
            rules:
              - backendRefs:
                  - name: signoz
                    port: 8080
      tags:
        - httproute

    - name: Create HTTPRoute
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: signoz-otel-collector
            namespace: "{{ target_namespace }}"
          spec:
            parentRefs:
              - name: local-gateway
                namespace: gateway-infra
            hostnames:
              - "signoz-otel-collector.{{ local_dns }}"
            rules:
              - backendRefs:
                  - name: signoz-otel-collector
                    port: 4318
      tags:
        - httproute
