---
- name: Postiz Redis
  hosts: k8s-control-plane-1
  become: false
  gather_facts: false
  vars:
    target_namespace: postiz
  tasks:
    - name: Remove Redis Enterprise operator
      kubernetes.core.k8s:
        state: absent
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: redis-enterprise-operator
        namespace: argocd

    - name: Remove Redis Enterprise database
      kubernetes.core.k8s:
        state: absent
        api_version: app.redislabs.com/v1alpha1
        kind: RedisEnterpriseDatabase
        name: postiz-redis
        namespace: "{{ target_namespace }}"

    - name: Remove Redis Enterprise cluster
      kubernetes.core.k8s:
        state: absent
        api_version: app.redislabs.com/v1
        kind: RedisEnterpriseCluster
        name: redis-enterprise
        namespace: redis-system

    - name: Create Redis credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: postiz-redis-auth
            namespace: "{{ target_namespace }}"
          type: Opaque
          stringData:
            password: "{{ postiz_redis_password }}"

    - name: Deploy Redis
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postiz-redis
            namespace: "{{ target_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postiz-redis
            template:
              metadata:
                labels:
                  app: postiz-redis
              spec:
                containers:
                  - name: redis
                    image: redis:7-alpine
                    args:
                      - redis-server
                      - --requirepass
                      - "$(REDIS_PASSWORD)"
                    env:
                      - name: REDIS_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: postiz-redis-auth
                            key: password
                    resources:
                      requests:
                        cpu: 10m
                        memory: 64Mi
                      limits:
                        cpu: 100m
                        memory: 128Mi
                    ports:
                      - name: redis
                        containerPort: 6379
    - name: Create Redis service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: postiz-redis
            namespace: "{{ target_namespace }}"
          spec:
            selector:
              app: postiz-redis
            ports:
              - name: redis
                port: 6379
                targetPort: 6379
