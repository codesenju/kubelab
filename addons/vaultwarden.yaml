---
- name: Vaultwarden Playbook
  hosts: k8s-control-plane-1
  gather_facts: false
  become: false
  tasks:


    - name: Deploy vaultwarden
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: vaultwarden
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: https://github.com/codesenju/kubelab.git
              path: kustomize/vaultwarden/overlays/prod
              targetRevision: main
              kustomize:
                # Add these to your existing kustomize config
                commonAnnotations:
                  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
                labels:
                  app.kubernetes.io/instance: vaultwarden-prod
            destination:
              server: https://kubernetes.default.svc
              namespace: zero-trust
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - RespectIgnoreDifferences=true
      tags: vaultwarden

    - name: Create vaultwarden secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: vaultwarden-secrets
            namespace: zero-trust
          type: Opaque
          stringData:
            ADMIN_TOKEN: "{{ vaultwarden_admin_token }}"
            DOMAIN: "{{ vaultwarden_domain }}"
      tags: vaultwarden
