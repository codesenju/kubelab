---
- name: Kubernetes Dependencies
  hosts: control-plane, workers
  become: true
  tasks:
    - name: Updates
      apt:
        update_cache: true

    - name: Install pip3
      apt:
        name: python3-pip
        state: present
        update_cache: true

    - name: Install required Python packages
      pip:
        name:
          - kubernetes
          - PyYAML
          - jsonpatch
        state: present

    - name: Install prerequisites
      apt:
        name:
          - curl
          - net-tools
          - bind9-utils
          - gnupg2
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - nfs-common
          - open-iscsi
          # NVMe-oF (NVMe over TCP) initiator tooling. Required by the
          # democratic-csi / TrueNAS csi-truenas driver, which mounts volumes
          # over nvme-tcp. Without the transport module present, every mount
          # fails with "nvme_fabrics: no handler found for transport tcp" and
          # Postgres/Nexus/etc. hang in Init waiting on their PVCs.
          - nvme-cli
          # Pulls linux-modules-extra for the running kernel (contains
          # nvme-tcp.ko) AND, as a metapackage, tracks every FUTURE kernel so
          # an unattended kernel bump can never again ship without the module.
          # The default cloud image uses linux-image-virtual, which omits the
          # extra modules — this is what broke NVMe-oF after a kernel upgrade.
          - linux-image-generic
        state: present
        update_cache: true

    - name: Ensure linux-modules-extra is present for the RUNNING kernel
      # linux-image-generic covers current+future kernels, but install the
      # concrete package for the already-running kernel too, so NVMe-oF works
      # immediately on an existing node without requiring the reboot below.
      apt:
        name: "linux-modules-extra-{{ ansible_kernel }}"
        state: present
        update_cache: true
      failed_when: false   # tolerate a running kernel with no matching -extra pkg

    - name: Disable SWAP
      shell: |
        swapoff -a

    - name: Disable SWAP in fstab
      replace:
        path: /etc/fstab
        regexp: "^([^#].*?\\sswap\\s+sw\\s+.*)$"
        replace: "# \\1"

    - name: Create an empty file for the containerd module
      copy:
        content: ""
        dest: /etc/modules-load.d/containerd.conf
        force: false

    - name: Configure modules for containerd
      blockinfile:
        path: /etc/modules-load.d/containerd.conf
        block: |
          overlay
          br_netfilter

    - name: Persist NVMe-oF (nvme-tcp) kernel modules across reboots
      # Mirrors the containerd module pattern. Ensures the NVMe-over-TCP
      # transport is auto-loaded at boot so the csi-truenas driver can always
      # connect its volumes.
      copy:
        content: |
          nvme_tcp
          nvme_fabrics
        dest: /etc/modules-load.d/nvme_tcp.conf
        mode: "0644"

    - name: Create an empty file for K8S sysctl parameters
      copy:
        content: ""
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        force: false

    - name: Configure sysctl parameters for K8S
      lineinfile:
        path: /etc/sysctl.d/99-kubernetes-cri.conf
        line: "{{ item }}"
      with_items:
        - "net.bridge.bridge-nf-call-iptables  = 1"
        - "net.ipv4.ip_forward                 = 1"
        - "net.bridge.bridge-nf-call-ip6tables = 1"

    - name: Apply sysctl parameters
      command: sysctl --system

    - name: Install APT Transport HTTPS
      apt:
        name: apt-transport-https
        state: present

    - name: Add Docker apt-key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker-apt-keyring.asc
        mode: "0644"
        force: true

    - name: Add Docker's APT repo
      apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker-apt-keyring.asc] https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable"
        state: present
        update_cache: true

    - name: Add Kubernetes apt-key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"
        force: true

    - name: Add Kubernetes APT repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
        state: present
        update_cache: true

    - name: Install containerd
      apt:
        name: containerd.io
        state: present

    - name: Create containerd directory
      file:
        path: /etc/containerd
        state: directory

    - name: Add containerd configuration
      shell: /usr/bin/containerd config default > /etc/containerd/config.toml

    - name: Configuring Systemd cgroup driver for containerd
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: "            SystemdCgroup = false"
        line: "            SystemdCgroup = true"

    - name: Enable the containerd service and start service
      systemd:
        name: containerd
        state: restarted
        enabled: true
        daemon-reload: true

    - name: Install Kubelet
      apt:
        name: kubelet={{ k8s_version }}.*
        state: present
        update_cache: true
      tags:
        - install_kubelet

    - name: Install Kubeadm
      apt:
        name: kubeadm={{ k8s_version }}.*
        state: present

    - name: Enable the Kubelet service
      service:
        name: kubelet
        enabled: true

    - name: Load br_netfilter kernel module
      modprobe:
        name: br_netfilter
        state: present

    - name: Load NVMe-oF (nvme-tcp) kernel module
      # Load now so NVMe-oF works without waiting for the reboot below. Depends
      # on nvme-tcp.ko being present, which linux-image-generic /
      # linux-modules-extra-<kernel> installed in the prerequisites above.
      modprobe:
        name: nvme_tcp
        state: present

    - name: Set bridge-nf-call-iptables
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: 1

    - name: Set ip_forward
      sysctl:
        name: net.ipv4.ip_forward
        value: 1

    - name: Reboot
      reboot:

- hosts: control-plane
  become: true
  tasks:
    - name: Install Kubectl
      apt:
        name: kubectl={{ k8s_version }}.*
        state: present
        force: true
