---
- name: TruenNAS CSI Playbook
  hosts: k8s-control-plane-1
  gather_facts: false
  become: false
  vars:
    target_namespace: csi-truenas
  tasks:
    - name: Deploy csi-truenas
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: csi-truenas
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            source:
              repoURL: https://github.com/codesenju/kubelab.git
              path: kustomize/csi-truenas/overlays/prod
              targetRevision: HEAD
              kustomize:
                # Images pull from their ORIGINAL upstream registries (ghcr.io,
                # registry.k8s.io) which are public and highly available. The
                # previous registry.jazziro.com mirror rewrites were removed after
                # that mirror proved flaky (503s causing ImagePullBackOff on the
                # CSI controller/sidecars). The base manifests already reference the
                # upstream images, so no `images:` rewrite block is needed.
                patches:
                  - target:
                      kind: Deployment
                      name: truenas-csi-controller
                    patch: |-
                      - op: add
                        path: /spec/template/spec/imagePullSecrets
                        value:
                          - name: registry-secret
                  # The controller Deployment must run in CONTROLLER-ONLY mode.
                  # The driver defaults to --mode=all, which makes the single
                  # controller pod register only its OWN node in an in-memory map;
                  # ControllerPublishVolume then rejects every other node with
                  # "node <name> not found", so NVMe-oF/iSCSI volumes only attach on
                  # the controller's node. In controller-only mode that map stays
                  # empty and node validation is skipped, allowing any node to mount.
                  - target:
                      kind: Deployment
                      name: truenas-csi-controller
                    patch: |-
                      - op: add
                        path: /spec/template/spec/containers/0/args/-
                        value: --mode=controller
                  - target:
                      kind: DaemonSet
                      name: truenas-csi-node
                    patch: |-
                      - op: add
                        path: /spec/template/spec/imagePullSecrets
                        value:
                          - name: registry-secret
                  - target:
                      kind: Secret
                      name: truenas-api-credentials
                    patch: |-
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: truenas-api-credentials
                        namespace: csi-truenas
                      type: Opaque
                      stringData:
                        api-key: "{{ truenas_api_key }}"
                  - target:
                      kind: ConfigMap
                      name: truenas-csi-config
                    patch: |-
                      apiVersion: v1
                      kind: ConfigMap
                      metadata:
                        name: truenas-csi-config
                        namespace: csi-truenas
                      data:
                        truenasURL: "{{ truenas_url }}"
                        truenasInsecure: "{{ truenas_insecure | default('true') | string }}"
                        defaultPool: "{{ truenas_pool }}"
                        nfsServer: "{{ truenas_nfs_server }}"
                        iscsiPortal: "{{ truenas_iscsi_portal }}"
                        iscsiIQNBase: "{{ truenas_iqn_base | default('iqn.2000-01.io.truenas') }}"
                  - target:
                      group: storage.k8s.io
                      version: v1
                      kind: StorageClass
                      name: truenas-iscsi
                    patch: |-
                      apiVersion: storage.k8s.io/v1
                      kind: StorageClass
                      metadata:
                        name: truenas-iscsi
                      parameters:
                        iscsi.networks: "192.168.0.0/24"
                  - target:
                      group: storage.k8s.io
                      version: v1
                      kind: StorageClass
                      name: truenas-nvmeof
                    patch: |-
                      apiVersion: storage.k8s.io/v1
                      kind: StorageClass
                      metadata:
                        name: truenas-nvmeof
                      parameters:
                        datasetPath: "k8s/nvmeof"
                  - target:
                      group: storage.k8s.io
                      version: v1
                      kind: StorageClass
                      name: truenas-nfs-zstd
                    patch: |-
                      apiVersion: storage.k8s.io/v1
                      kind: StorageClass
                      metadata:
                        name: truenas-nfs-zstd
                      parameters:
                        dataset: pool2/csi-k8s/
            destination:
              server: https://kubernetes.default.svc
              namespace: csi-truenas
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - RespectIgnoreDifferences=true

# ---------------------------------------------------------------------------
# NVMe-oF (NVMe/TCP) node prerequisites
#
# The TrueNAS CSI driver (v25.10+) supports a `protocol: nvmeof` StorageClass,
# and the TrueNAS appliance already exposes an NVMe/TCP port (4420). To MOUNT
# an NVMe-oF volume, each worker node must have the `nvme_tcp` kernel module
# available and loaded; the driver calls `modprobe nvme_tcp` but cannot supply
# the module itself.
#
# This play installs the module package + nvme-cli on all workers, loads the
# module now, and makes it persist across reboots.
#
# Gated behind the `nvme` tag so it only runs when explicitly requested:
#   ansible-playbook ../storage/truenas/main.yaml \
#     -i inventories/prod/hosts.ini --tags nvme
#
# (requires the [workers] group to be present in the chosen inventory)
# ---------------------------------------------------------------------------
- name: NVMe-oF node prerequisites
  hosts: workers
  gather_facts: true
  become: true
  tags:
    - nvme
  tasks:
    - name: Install nvme_tcp kernel module package and nvme-cli
      ansible.builtin.apt:
        name:
          - "linux-modules-extra-{{ ansible_kernel }}"
          - nvme-cli
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Load nvme_tcp module now
      community.general.modprobe:
        name: nvme_tcp
        state: present

    - name: Persist nvme_tcp across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/nvme_tcp.conf
        content: "nvme_tcp\n"
        owner: root
        group: root
        mode: "0644"

    - name: Verify nvme_tcp is loaded
      ansible.builtin.command: lsmod
      register: _lsmod
      changed_when: false

    - name: Assert nvme_tcp present
      ansible.builtin.assert:
        that:
          - "'nvme_tcp' in _lsmod.stdout"
        success_msg: "nvme_tcp loaded on {{ inventory_hostname }}"
        fail_msg: "nvme_tcp NOT loaded on {{ inventory_hostname }}"
